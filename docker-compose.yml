# Local dev stack: Postgres, MLflow, the FastAPI backend, and the Next.js
# frontend. See docs/day1_status.md for what's been verified against a real
# Docker daemon vs. what's a sandbox-only limitation of this dev environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      - postgres

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://argus:argus@postgres/argus
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - postgres
      - mlflow

  frontend:
    build:
      context: ./frontend
      args:
        # the browser calls the backend directly, so this must be reachable
        # from wherever the browser runs -- localhost:8000 for local dev.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  mlflow_artifacts:
