# Render Blueprint for the Argus backend. Deploy: connect this repo at
# https://dashboard.render.com/blueprints, Render reads this file and
# proposes the service below. See docs/DEPLOYMENT.md for the full
# checklist (this file alone won't give you a live URL -- it needs a
# connected Render account, and the frontend deploys separately on
# Vercel).
#
# Uses the free plan by default so nothing here can incur cost without a
# deliberate upgrade in the Render dashboard. The free plan sleeps after
# 15 minutes idle (a cold request takes ~30-60s to wake it) and its disk
# is ephemeral -- fine for a demo/judge flow (the preloaded demo reseeds
# itself on every boot from backend/app/demo_bundle/), not for data you
# need to keep across deploys. For that, add a Render Postgres instance
# and point DATABASE_URL / MLFLOW_TRACKING_URI at it instead of sqlite.

services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # /ready actually checks the DB, the demo bundle, and the seeded demo
    # run -- not just "the process is alive" like /health -- so a broken
    # deploy fails this check visibly instead of reporting healthy while
    # a judge's first click would fail. Found in external code review.
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/argus.db
      - key: MLFLOW_TRACKING_URI
        value: sqlite:////opt/render/project/src/mlflow.db
      - key: ANTHROPIC_API_KEY
        sync: false # OPTIONAL and deliberately left unset for the public demo:
        # the deterministic planner is used automatically whenever this is
        # unset. Do NOT set it while ARGUS_ENABLE_LIVE_RUNS is true on a
        # public URL -- anyone could burn credits by submitting runs.
      - key: ARGUS_ENABLE_LIVE_RUNS
        value: "false" # public-demo safety default: the queue bound caps
        # concurrency, not total cost -- anyone could keep submitting
        # expensive training jobs. The preloaded demo run (promote /
        # predict / replay) works with this off. Flip to "true" only for a
        # private/judged deployment where you accept that cost.
      - key: ARGUS_CORS_ORIGINS
        sync: false # set in the Render dashboard to the deployed Vercel origin,
        # e.g. https://argus-<project>.vercel.app -- defaults to "*" (open)
        # if left unset, so set this before treating the deploy as done
      - key: ARGUS_ENABLE_UPLOADS
        value: "false" # public-demo safety default: the upload endpoint's 24h
        # expiry promise isn't enforced by a real cleanup job yet (see
        # docs/day1_status.md); disabling it is the safer default for a
        # public deployment. Uploads were never wired into the training
        # loop regardless -- only the bundled FD001 dataset can start a run.
